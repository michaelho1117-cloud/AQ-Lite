name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile
        run: python -m py_compile aq.py judge/*.py
      - name: offline smoke test (no network)
        run: |
          python aq.py size --anchor 0.30 --mid 0.22 --price 0.23 --side YES --cat tech --assets 2000 --cash 600
          python aq.py rules hydrogen > /tmp/rules.txt && head -20 /tmp/rules.txt
          python -c "import judge; print('judge ok')"
      - name: secret scan
        run: |
          ! grep -rInE '0x[a-fA-F0-9]{64}|PRIVATE_KEY *=|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}' --exclude-dir=.git --exclude-dir=.github .
